<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <div class="container">
        <h1>Login Here</h1>
        <form action="" method="post" id="login">
            <h6 class="output"></h6>
            <label for="email">Email:</label>
            <input type="email" autocomplete="email" name="email" id="email" placeholder="Enter email" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" autocomplete="password" name="password" id="password" placeholder="Enter password" required>
            <br><br>
            <input type="submit" class="btn" value="Login">
            <p class="account-text">
                Don't have an account?
                <a href="register.html">REGISTER</a>
            </p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
